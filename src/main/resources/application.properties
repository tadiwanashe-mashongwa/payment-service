spring.application.name=payment-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/sparelink}
spring.security.oauth2.client.registration.payment-service.provider=keycloak
spring.security.oauth2.client.registration.payment-service.client-id=payment-service
spring.security.oauth2.client.registration.payment-service.client-secret=${PAYMENT_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.payment-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/sparelink}/protocol/openid-connect/token

customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8085}
payment.provider=${PAYMENT_PROVIDER:local}
payment.callback.secret=${PAYMENT_CALLBACK_SECRET}

management.endpoints.web.exposure.include=health,info
